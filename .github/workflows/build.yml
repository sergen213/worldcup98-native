name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-cxx23
            cc: gcc
            cxx: g++
            preset: ci-cxx23
          - name: clang-cxx23
            cc: clang
            cxx: clang++
            preset: ci-cxx23
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libpng-dev libvulkan-dev libopenal-dev \
            libglm-dev libsdl3-dev glslang-tools
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
